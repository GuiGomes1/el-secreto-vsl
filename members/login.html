<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Music Academy | Login</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070710;
            --card: rgba(18, 18, 30, 0.85);
            --accent: #1DB954;
            --accent-hover: #1ed760;
            --accent-glow: rgba(29, 185, 84, 0.3);
            --text: #ffffff;
            --text-muted: #8a8a9a;
            --border: rgba(255,255,255,0.08);
            --error: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: floatOrb 12s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #1DB954, transparent);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #00bcff, transparent);
            bottom: -80px; right: -80px;
            animation-delay: -6s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #7c3aed, transparent);
            top: 50%; left: 60%;
            animation-delay: -3s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Login Card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(29,185,84,0.05);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .login-logo .brand-accent {
            color: var(--accent);
        }

        .login-logo .tagline {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 32px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
            background: rgba(29, 185, 84, 0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder { color: rgba(255,255,255,0.25); }

        .error-msg {
            display: none;
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--error);
            margin-bottom: 18px;
            text-align: center;
        }

        .error-msg.show { display: block; animation: shake 0.4s ease; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), #15a347);
            color: #000;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-login:hover::after { background: rgba(255,255,255,0.08); }
        .btn-login:active { transform: translateY(0); }

        .support-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .support-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .support-link a:hover { text-decoration: underline; }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 28px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-logo">
            <div class="brand"><span class="brand-accent">AI</span>MUSIC ACADEMY</div>
            <div class="tagline">🔒 Exclusive Members Area</div>
        </div>

        <div class="divider"></div>

        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Enter your credentials to access the course.</p>

        <div class="error-msg" id="errorMsg">
            ❌ Incorrect username or password. Try again.
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                Access Course →
            </button>
        </form>

        <div class="support-link">
            Need help? <a href="mailto:support@nationalwinners.online">Contact Support</a>
        </div>

        <div class="security-badge">
            🔐 Secure & Encrypted Connection
        </div>
    </div>
</div>

<script>
    // =============================================
    // CREDENTIALS — change username and password here
    // =============================================
    var VALID_USERNAME = "usuário112";
    var VALID_PASSWORD = "usuário123@#";
    // =============================================

    // If already logged in, go straight to members
    if (localStorage.getItem("aim_auth") === "true") {
        window.location.href = "index.html";
    }

    function handleLogin(e) {
        e.preventDefault();
        var user = document.getElementById("username").value.trim();
        var pass = document.getElementById("password").value.trim();
        var btn = document.getElementById("loginBtn");
        var err = document.getElementById("errorMsg");

        btn.textContent = "Checking...";
        btn.style.opacity = "0.7";

        setTimeout(function() {
            if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
                localStorage.setItem("aim_auth", "true");
                btn.textContent = "✓ Access Granted!";
                btn.style.background = "linear-gradient(135deg, #1DB954, #15a347)";
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 500);
            } else {
                err.classList.add("show");
                btn.textContent = "Access Course →";
                btn.style.opacity = "1";
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }, 600);
    }
</script>

</body>
</html>
