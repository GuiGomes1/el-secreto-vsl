<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Secreto Femenino | Área de Miembros</title>
  
  <meta name="theme-color" content="#900000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="app.css?v=8">
</head>
<body>

  <!-- Husky App Header -->
  <header class="husky-header">
    <div class="husky-header-content">
      <div class="husky-logo-wrap">
        <div class="husky-logo-circle">
          <span class="husky-logo-s">S</span>
        </div>
        <span class="husky-app-title">El Secreto Femenino</span>
      </div>
      <div class="husky-header-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Buscar módulo...">
        </div>
        <button class="icon-btn" title="Download">
          <i class="fa-solid fa-download"></i>
        </button>
        <button class="icon-btn" title="Notificaciones">
          <i class="fa-solid fa-bell"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Categories Filter Bar -->
  <nav class="categories-bar">
    <button class="cat-tab active" onclick="filterCategory('all', this)">Todos los Módulos</button>
    <button class="cat-tab" onclick="filterCategory('main', this)">Cursos Principales</button>
    <button class="cat-tab" onclick="filterCategory('bonus', this)">Módulos VIP & Bónus</button>
    <button class="cat-tab" onclick="filterCategory('pdf', this)">E-Books & Guías</button>
  </nav>

  <!-- Grid of Modules (Exact 1:1 Husky App Style) -->
  <main class="modules-grid-container">
    <div id="modulesGrid" class="husky-modules-grid"></div>
  </main>

  <!-- Netflix Player Modal -->
  <div id="netflixModal" class="netflix-modal">
    <div class="modal-content-box">
      <button class="modal-close-btn" onclick="closeNetflixModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Player Area -->
      <div id="modalPlayerArea" class="modal-player-area"></div>

      <!-- Info & Episode List -->
      <div class="modal-info-padding">
        <h2 id="modalCourseTitle" style="font-size: 1.4rem; font-weight: 800; color: #fff;"></h2>
        <p id="modalCourseDesc" style="color: #aaa; margin-top: 6px; font-size: 0.88rem;"></p>

        <h4 style="font-size: 1.05rem; color: #fff; margin-top: 20px; font-weight: 700;">
          Clases disponibles:
        </h4>
        <div id="modalEpisodeList" class="episode-list"></div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom App Bar -->
  <nav class="bottom-app-bar">
    <a class="app-bar-item active" onclick="filterCategory('all', null)">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </a>
    <a class="app-bar-item" onclick="filterCategory('main', null)">
      <i class="fa-solid fa-play-circle"></i>
      <span>Cursos</span>
    </a>
    <a class="app-bar-item" onclick="filterCategory('bonus', null)">
      <i class="fa-solid fa-gift"></i>
      <span>Bónus</span>
    </a>
    <a class="app-bar-item" onclick="filterCategory('pdf', null)">
      <i class="fa-solid fa-book-open"></i>
      <span>E-Books</span>
    </a>
  </nav>

  <script src="app.js?v=8"></script>
</body>
</html>
